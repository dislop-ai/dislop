<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" fill="none" role="img" aria-label="dislop — 去 AI 味才是真正的生产力！">
  <title>dislop — 去 AI 味才是真正的生产力！</title>
  <rect width="1200" height="300" fill="#F6F7F5"/>
  <!-- Architectural 1px galley rails -->
  <line x1="48" y1="0" x2="48" y2="300" stroke="#D5D7D2" stroke-width="1"/>
  <line x1="612" y1="0" x2="612" y2="300" stroke="#D5D7D2" stroke-width="1"/>
  <line x1="1152" y1="0" x2="1152" y2="300" stroke="#D5D7D2" stroke-width="1"/>
  <line x1="0" y1="36" x2="1200" y2="36" stroke="#D5D7D2" stroke-width="1"/>
  <line x1="0" y1="264" x2="1200" y2="264" stroke="#D5D7D2" stroke-width="1"/>

  <!-- Left column: Canonical Vermilion Mark + Wordmark + Chinese Slogan -->
  <g transform="translate(84, 72)">
    <g transform="scale(0.875)">
      <rect width="64" height="64" rx="12" fill="#14171A"/>
      <line x1="10" y1="38" x2="54" y2="38" stroke="#F4F5F3" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.26"/>
      <path d="M10 38H34C44.5 38 52 30.8 52 21.5C52 14.5 47.2 10 41.2 10C34.8 10 30.5 15 30.5 22.2C30.5 33.8 39.5 45.5 53 51" stroke="#F04438" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="76" y="43" fill="#14171A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1.2">dislop</text>
  </g>

  <text x="84" y="174" fill="#14171A" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, sans-serif" font-size="25" font-weight="700">去 AI 味才是真正的生产力！</text>
  <text x="84" y="212" fill="#474C55" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="15">AI 味检查工具  |  文档 · 网页 · Word · PPT</text>

  <!-- Right column: Pure Chinese Anti-Slop Proof Specimen -->
  <rect x="613" y="37" width="538" height="226" rx="0" fill="#FFFFFF"/>
  <text x="646" y="76" fill="#474C55" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="15">dislop check  ·  1 处硬伤  ·  1 条提醒</text>

  <!-- Struck AI chat opener with dele loop -->
  <rect x="644" y="102" width="212" height="30" rx="0" fill="#FEF3F2"/>
  <text x="646" y="125" font-family="'Songti SC', 'Noto Serif CJK SC', 'STSong', Georgia, serif" font-size="21"><tspan fill="#5E646E">好的，以下是修改后：</tspan><tspan fill="#14171A" dx="24">本次上线说明</tspan></text>
  <path data-dele="true" d="M645 118H850C858 118 865 112 865 105C865 100 861 97 856 97C851 97 848 101 848 106C848 115 855 123 866 127" stroke="#F04438" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dashed blue cliché mark -->
  <rect x="644" y="148" width="360" height="28" rx="0" fill="#EFF4FF"/>
  <text x="646" y="168" fill="#14171A" font-family="'Songti SC', 'Noto Serif CJK SC', 'STSong', Georgia, serif" font-size="21">这不是一次升级，而是一场范式革命。</text>
  <line x1="646" y1="177" x2="1003" y2="177" stroke="#1B52B0" stroke-width="2.2" stroke-dasharray="6 4"/>

  <!-- Legend -->
  <text x="646" y="218" fill="#B42318" font-family="'PingFang SC', 'Hiragino Sans GB', ui-monospace, monospace" font-size="15" font-weight="600">硬伤：AI 寒暄</text>
  <text x="826" y="218" fill="#1B52B0" font-family="'PingFang SC', 'Hiragino Sans GB', ui-monospace, monospace" font-size="15" font-weight="600">提醒：反转套句</text>
</svg>
