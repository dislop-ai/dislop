<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" fill="none" role="img" aria-label="dislop — 去 AI 味才是真正的生产力！">
  <title>dislop — 去 AI 味才是真正的生产力！</title>
  <rect width="1200" height="300" fill="#F6F7F5"/>
  <!-- Architectural 1px galley rails -->
  <line x1="48" y1="0" x2="48" y2="300" stroke="#D5D7D2" stroke-width="1"/>
  <line x1="620" y1="0" x2="620" y2="300" stroke="#D5D7D2" stroke-width="1"/>
  <line x1="1152" y1="0" x2="1152" y2="300" stroke="#D5D7D2" stroke-width="1"/>
  <line x1="0" y1="36" x2="1200" y2="36" stroke="#D5D7D2" stroke-width="1"/>
  <line x1="0" y1="264" x2="1200" y2="264" stroke="#D5D7D2" stroke-width="1"/>

  <!-- Left column: Master Vermilion Mark + Wordmark + Chinese Slogan -->
  <g transform="translate(84, 76)">
    <rect width="56" height="56" rx="10.5" fill="#14171A"/>
    <line x1="9" y1="33" x2="47" y2="33" stroke="#F4F5F3" stroke-width="4" stroke-linecap="round" stroke-opacity="0.26"/>
    <path d="M9 33H30C39 33 45.5 26.8 45.5 18.8C45.5 12.6 41.3 8.8 36 8.8C30.5 8.8 26.7 13.1 26.7 19.4C26.7 29.5 34.6 39.8 46.4 44.6" stroke="#F04438" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="43" fill="#14171A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1.2">dislop</text>
  </g>

  <text x="84" y="176" fill="#14171A" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, sans-serif" font-size="25" font-weight="700">去 AI 味才是真正的生产力！</text>
  <text x="84" y="210" fill="#474C55" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', ui-monospace, SFMono-Regular, monospace" font-size="13.5">AI 味检查工具  |  文档 · 网页 · Word · PPT</text>

  <!-- Right column: Pure Chinese Anti-Slop Proof Specimen -->
  <rect x="621" y="37" width="530" height="226" fill="#FFFFFF"/>
  <text x="652" y="76" fill="#474C55" font-family="'PingFang SC', 'Hiragino Sans GB', ui-monospace, SFMono-Regular, monospace" font-size="12.5">dislop check  ·  1 处硬伤  ·  1 条提醒</text>

  <!-- Struck AI chat opener -->
  <text x="652" y="128" fill="#5E646E" font-family="'PingFang SC', 'Songti SC', 'Noto Serif CJK SC', serif" font-size="21">好的，以下是修改后：</text>
  <line x1="648" y1="121" x2="854" y2="121" stroke="#F04438" stroke-width="2.6" stroke-linecap="round"/>
  <text x="874" y="128" fill="#14171A" font-family="'PingFang SC', 'Songti SC', 'Noto Serif CJK SC', serif" font-size="21">本次上线说明</text>

  <!-- Dashed blue cliché mark -->
  <text x="652" y="168" fill="#14171A" font-family="'PingFang SC', 'Songti SC', 'Noto Serif CJK SC', serif" font-size="21">这不是一次升级，而是一场范式革命。</text>
  <line x1="652" y1="177" x2="1012" y2="177" stroke="#1B52B0" stroke-width="2.2" stroke-dasharray="6 4"/>

  <!-- Legend -->
  <text x="652" y="218" fill="#B42318" font-family="'PingFang SC', 'Hiragino Sans GB', ui-monospace, monospace" font-size="13" font-weight="600">红线：AI 寒暄硬伤</text>
  <text x="826" y="218" fill="#1B52B0" font-family="'PingFang SC', 'Hiragino Sans GB', ui-monospace, monospace" font-size="13" font-weight="600">蓝线：反转套句提醒</text>
