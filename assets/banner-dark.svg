<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" fill="none" role="img" aria-label="dislop — Cutting AI slop is real productivity.">
  <title>dislop — Cutting AI slop is real productivity.</title>
  <rect width="1200" height="300" fill="#0E1012"/>
  <!-- Architectural 1px galley rails -->
  <line x1="48" y1="0" x2="48" y2="300" stroke="#2A2F37" stroke-width="1"/>
  <line x1="612" y1="0" x2="612" y2="300" stroke="#2A2F37" stroke-width="1"/>
  <line x1="1152" y1="0" x2="1152" y2="300" stroke="#2A2F37" stroke-width="1"/>
  <line x1="0" y1="36" x2="1200" y2="36" stroke="#2A2F37" stroke-width="1"/>
  <line x1="0" y1="264" x2="1200" y2="264" stroke="#2A2F37" stroke-width="1"/>

  <!-- Left column: Canonical Vermilion Mark + Wordmark -->
  <g transform="translate(84, 72)">
    <g transform="scale(0.875)">
      <rect width="64" height="64" rx="12" fill="#1D2127" stroke="#3E4551" stroke-width="1.15"/>
      <line x1="10" y1="38" x2="54" y2="38" stroke="#ECEEF0" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.28"/>
      <path d="M10 38H34C44.5 38 52 30.8 52 21.5C52 14.5 47.2 10 41.2 10C34.8 10 30.5 15 30.5 22.2C30.5 33.8 39.5 45.5 53 51" stroke="#F04438" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="76" y="43" fill="#ECEEF0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1.2">dislop</text>
  </g>

  <text x="84" y="174" fill="#ECEEF0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600">Cutting AI slop is real productivity.</text>
  <text x="84" y="212" fill="#A6ACB5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">Linter for AI Slop  |  Skill · Plugin · CLI · MCP</text>

  <!-- Right column: Monotonic raised sheet (#15181C > #0E1012) -->
  <rect x="613" y="37" width="538" height="226" rx="0" fill="#15181C"/>
  <text x="646" y="76" fill="#A6ACB5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">dislop check  ·  1 hard bug  ·  1 warning</text>

  <!-- Struck AI chat opener with dele loop -->
  <rect x="644" y="102" width="212" height="30" rx="0" fill="#F04438" fill-opacity="0.14"/>
  <text x="646" y="125" font-family="Georgia, 'Times New Roman', serif" font-size="21"><tspan fill="#8C939E">Certainly! Here it is:</tspan><tspan fill="#ECEEF0" dx="28">This release is</tspan></text>
  <path data-dele="true" d="M645 118H842C850 118 857 112 857 105C857 100 853 97 848 97C843 97 840 101 840 106C840 115 847 123 858 127" stroke="#F04438" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dashed blue cliché mark -->
  <rect x="644" y="146" width="352" height="28" rx="0" fill="#85B4FF" fill-opacity="0.12"/>
  <text x="646" y="166" fill="#ECEEF0" font-family="Georgia, 'Times New Roman', serif" font-size="21">not just faster — it's a paradigm shift.</text>
  <line x1="646" y1="175" x2="994" y2="175" stroke="#85B4FF" stroke-width="2.2" stroke-dasharray="6 4"/>

  <!-- Legend -->
  <text x="646" y="218" fill="#FF7A6B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600">error: chat wrapper</text>
  <text x="866" y="218" fill="#85B4FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600">warn: slogan frame</text>
</svg>
