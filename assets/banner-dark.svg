<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" fill="none" role="img" aria-label="dislop — Cutting AI slop is real productivity.">
  <title>dislop — Cutting AI slop is real productivity.</title>
  <rect width="1200" height="300" fill="#0E1012"/>
  <!-- Architectural 1px galley rails -->
  <line x1="48" y1="0" x2="48" y2="300" stroke="#2A2F37" stroke-width="1"/>
  <line x1="620" y1="0" x2="620" y2="300" stroke="#2A2F37" stroke-width="1"/>
  <line x1="1152" y1="0" x2="1152" y2="300" stroke="#2A2F37" stroke-width="1"/>
  <line x1="0" y1="36" x2="1200" y2="36" stroke="#2A2F37" stroke-width="1"/>
  <line x1="0" y1="264" x2="1200" y2="264" stroke="#2A2F37" stroke-width="1"/>

  <!-- Left column: Master Vermilion Mark + Wordmark -->
  <g transform="translate(84, 76)">
    <rect width="56" height="56" rx="10.5" fill="#1D2127" stroke="#3E4551" stroke-width="1"/>
    <line x1="9" y1="33" x2="47" y2="33" stroke="#ECEEF0" stroke-width="4" stroke-linecap="round" stroke-opacity="0.28"/>
    <path d="M9 33H30C39 33 45.5 26.8 45.5 18.8C45.5 12.6 41.3 8.8 36 8.8C30.5 8.8 26.7 13.1 26.7 19.4C26.7 29.5 34.6 39.8 46.4 44.6" stroke="#F04438" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="43" fill="#ECEEF0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1.2">dislop</text>
  </g>

  <text x="84" y="176" fill="#ECEEF0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="600">Cutting AI slop is real productivity.</text>
  <text x="84" y="210" fill="#A6ACB5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">Linter for AI Slop  |  Skill · Plugin · CLI · MCP</text>

  <!-- Right column: Monotonic raised sheet (#15181C > #0E1012) -->
  <rect x="621" y="37" width="530" height="226" fill="#15181C"/>
  <text x="652" y="76" fill="#A6ACB5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">dislop check  ·  1 artifact  ·  1 cliché</text>

  <!-- Struck AI chat opener -->
  <text x="652" y="128" fill="#8C939E" font-family="Georgia, 'Times New Roman', serif" font-size="21">Certainly! Here is:</text>
  <line x1="648" y1="121" x2="824" y2="121" stroke="#F04438" stroke-width="2.6" stroke-linecap="round"/>
  <text x="836" y="128" fill="#ECEEF0" font-family="Georgia, 'Times New Roman', serif" font-size="21">This release is</text>

  <!-- Dashed blue cliché mark -->
  <text x="652" y="166" fill="#ECEEF0" font-family="Georgia, 'Times New Roman', serif" font-size="21">not just faster — it's a paradigm shift.</text>
  <line x1="652" y1="175" x2="1014" y2="175" stroke="#85B4FF" stroke-width="2.2" stroke-dasharray="6 4"/>

  <!-- Legend -->
  <text x="652" y="216" fill="#FF7A6B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600">red: chatbot greeting</text>
  <text x="864" y="216" fill="#85B4FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600">blue: AI slogan frame</text>
</svg>
