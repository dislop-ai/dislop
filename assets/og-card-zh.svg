<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="dislop — 去 AI 味才是真正的生产力！">
  <title>dislop — 去 AI 味才是真正的生产力！</title>
  <!-- Charcoal Ink Stage (#14171A) framing a crisp 0px White Galley Slip -->
  <rect width="1200" height="630" fill="#14171A"/>
  <line x1="56" y1="0" x2="56" y2="630" stroke="#2D333B" stroke-width="1"/>
  <line x1="1144" y1="0" x2="1144" y2="630" stroke="#2D333B" stroke-width="1"/>
  <line x1="0" y1="48" x2="1200" y2="48" stroke="#2D333B" stroke-width="1"/>
  <line x1="0" y1="582" x2="1200" y2="582" stroke="#2D333B" stroke-width="1"/>

  <!-- Central clean galley slip -->
  <rect x="57" y="49" width="1086" height="532" rx="0" fill="#FFFFFF"/>

  <!-- Brand header using canonical logo.svg geometry -->
  <g transform="translate(112, 96)">
    <g transform="scale(0.90625)">
      <rect width="64" height="64" rx="12" fill="#14171A"/>
      <line x1="10" y1="38" x2="54" y2="38" stroke="#F4F5F3" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.26"/>
      <path d="M10 38H34C44.5 38 52 30.8 52 21.5C52 14.5 47.2 10 41.2 10C34.8 10 30.5 15 30.5 22.2C30.5 33.8 39.5 45.5 53 51" stroke="#F04438" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="78" y="45" fill="#14171A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2">dislop</text>
    <text x="234" y="42" fill="#474C55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">dislop.com</text>
  </g>

  <!-- Struck AI opener with authentic dele loop -->
  <rect x="110" y="204" width="578" height="48" rx="0" fill="#FEF3F2"/>
  <text x="116" y="241" fill="#5E646E" font-family="'Songti SC', 'Noto Serif CJK SC', 'STSong', Georgia, serif" font-size="38">好的，以下是为您润色后的版本。</text>
  <path data-dele="true" d="M112 228H672C688 228 700 217 700 204C700 194 693 188 684 188C674 188 668 195 668 205C668 221 682 238 702 245" stroke="#F04438" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="112" y="328" fill="#14171A" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, sans-serif" font-size="52" font-weight="700">去 AI 味才是真正的生产力！</text>

  <!-- Proof strip showing wash + Chinese cliché marks -->
  <rect x="112" y="374" width="976" height="114" rx="0" fill="#F6F7F5" stroke="#D5D7D2" stroke-width="1"/>
  <rect x="142" y="399" width="166" height="36" rx="0" fill="#EFF4FF"/>
  <rect x="598" y="399" width="58" height="36" rx="0" fill="#EFF4FF"/>
  <rect x="678" y="399" width="112" height="36" rx="0" fill="#EFF4FF"/>
  <text x="146" y="427" fill="#14171A" font-family="'Songti SC', 'Noto Serif CJK SC', 'STSong', Georgia, serif" font-size="27"><tspan>值得注意的是，</tspan><tspan>本次改造以队列分级为</tspan><tspan>抓手</tspan><tspan>，</tspan><tspan>全面赋能</tspan><tspan>一线团队。</tspan></text>
  <line x1="146" y1="437" x2="306" y2="437" stroke="#1B52B0" stroke-width="2.4" stroke-dasharray="6 4"/>
  <line x1="600" y1="437" x2="654" y2="437" stroke="#1B52B0" stroke-width="2.4" stroke-dasharray="6 4"/>
  <line x1="681" y1="437" x2="788" y2="437" stroke="#1B52B0" stroke-width="2.4" stroke-dasharray="6 4"/>
  <text x="146" y="468" fill="#1B52B0" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="600">1 处硬伤  ·  3 条提醒  ·  文档、网页与 PPT 离线自检</text>

  <!-- Clean footer strip -->
  <text x="112" y="542" fill="#474C55" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="500">AI 味检查工具 — 帮你和你的 Agent 在交付前挑出并改掉 AI 味。</text>
