<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="dislop — 去 AI 味才是真正的生产力！">
  <title>dislop — 去 AI 味才是真正的生产力！</title>
  <rect width="1200" height="630" fill="#F6F7F5"/>

  <!-- Architectural galley rails -->
  <line x1="64" y1="0" x2="64" y2="630" stroke="#D5D7D2" stroke-width="1"/>
  <line x1="1136" y1="0" x2="1136" y2="630" stroke="#D5D7D2" stroke-width="1"/>
  <line x1="0" y1="56" x2="1200" y2="56" stroke="#D5D7D2" stroke-width="1"/>
  <line x1="0" y1="574" x2="1200" y2="574" stroke="#D5D7D2" stroke-width="1"/>

  <!-- Central clean paper sheet -->
  <rect x="65" y="57" width="1070" height="516" fill="#FFFFFF"/>

  <!-- Brand header -->
  <g transform="translate(116, 102)">
    <rect width="58" height="58" rx="11" fill="#14171A"/>
    <line x1="10" y1="34" x2="48" y2="34" stroke="#F4F5F3" stroke-width="4.2" stroke-linecap="round" stroke-opacity="0.26"/>
    <path d="M10 34H31C40 34 46.8 27.6 46.8 19.4C46.8 13.1 42.5 9.2 37.1 9.2C31.4 9.2 27.5 13.6 27.5 20.1C27.5 30.5 35.6 41 47.8 46" stroke="#F04438" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="45" fill="#14171A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2">dislop</text>
    <text x="234" y="42" fill="#474C55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">dislop.com</text>
  </g>

  <!-- Struck AI opener + Chinese slogan -->
  <text x="116" y="244" fill="#5E646E" font-family="'Songti SC', 'Noto Serif CJK SC', 'STSong', Georgia, serif" font-size="38">好的，以下是为您润色后的版本。</text>
  <path d="M114 230 C280 223 480 233 688 226" stroke="#F04438" stroke-width="5" stroke-linecap="round"/>

  <text x="116" y="330" fill="#14171A" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, sans-serif" font-size="52" font-weight="700">去 AI 味才是真正的生产力！</text>

  <!-- Proof strip showing Chinese cliché marks -->
  <rect x="116" y="378" width="968" height="110" rx="0" fill="#F6F7F5" stroke="#D5D7D2" stroke-width="1"/>
  <text x="148" y="428" fill="#14171A" font-family="'Songti SC', 'Noto Serif CJK SC', 'STSong', Georgia, serif" font-size="26"><tspan>值得注意的是，</tspan><tspan>本次改造以队列分级为</tspan><tspan>抓手</tspan><tspan>，</tspan><tspan>全面赋能</tspan><tspan>一线团队。</tspan></text>
  <line x1="148" y1="438" x2="304" y2="438" stroke="#1B52B0" stroke-width="2.4" stroke-dasharray="6 4"/>
  <line x1="590" y1="438" x2="642" y2="438" stroke="#1B52B0" stroke-width="2.4" stroke-dasharray="6 4"/>
  <line x1="668" y1="438" x2="772" y2="438" stroke="#1B52B0" stroke-width="2.4" stroke-dasharray="6 4"/>
  <text x="148" y="468" fill="#1B52B0" font-family="'PingFang SC', 'Hiragino Sans GB', ui-monospace, monospace" font-size="16" font-weight="600">3 处空话提醒  ·  文档、PPT 与网页离线自检</text>

  <!-- Clean footer strip -->
  <text x="116" y="540" fill="#474C55" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="500">专用的 AI 味检查工具 — 帮你和你的 Agent 在交付前挑出并改掉 AI 味。</text>
</svg>
