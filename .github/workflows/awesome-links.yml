name: Awesome Anti-Slop Link Health

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: awesome-links-health
  cancel-in-progress: true

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run Awesome Anti-Slop link & GitHub repo check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/check_awesome_links.mjs --github --json --out /tmp/awesome-link-report.json

      - name: Update single health tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node - <<'EOF'
          import fs from "node:fs";
          import { spawnSync } from "node:child_process";

          const report = JSON.parse(fs.readFileSync("/tmp/awesome-link-report.json", "utf8"));
          const { summary, results } = report;
          const broken = results.filter((r) => r.health === "broken");
          const warn = results.filter((r) => r.health === "warn");

          const lines = [
            `Checked **${summary.total}** Awesome Anti-Slop entries at \`${summary.checkedAt}\`.`,
            "",
            `- OK: \`${summary.ok}\``,
            `- Warn (rate-limited/archived): \`${summary.warn}\``,
            `- Broken: \`${summary.broken}\``,
          ];
          if (broken.length > 0) {
            lines.push("", "## Broken links", "");
            for (const b of broken) lines.push(`- \`${b.id}\` (${b.error || `HTTP ${b.status}`}): ${b.url}`);
          }
          if (warn.length > 0) {
            lines.push("", "## Warnings", "");
            for (const w of warn) {
              const reason = w.github?.archived ? "GitHub archived" : w.error || `HTTP ${w.status}`;
              lines.push(`- \`${w.id}\` (${reason}): ${w.url}`);
            }
          }
          const body = lines.join("\n");
          const title = "Awesome Anti-Slop link health";

          const listRes = spawnSync("gh", ["issue", "list", "--state", "all", "--search", `"${title}" in:title`, "--json", "number,title,state"], { encoding: "utf8" });
          const existing = listRes.status === 0 ? JSON.parse(listRes.stdout || "[]").find((i) => i.title === title) : null;

          if (existing) {
            spawnSync("gh", ["issue", "edit", String(existing.number), "--body", body], { stdio: "inherit" });
            if (broken.length === 0 && existing.state === "OPEN") {
              spawnSync("gh", ["issue", "close", String(existing.number)], { stdio: "inherit" });
            } else if (broken.length > 0 && existing.state === "CLOSED") {
              spawnSync("gh", ["issue", "reopen", String(existing.number)], { stdio: "inherit" });
            }
          } else if (broken.length > 0) {
            spawnSync("gh", ["issue", "create", "--title", title, "--body", body], { stdio: "inherit" });
          }
          EOF
