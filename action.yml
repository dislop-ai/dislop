name: "dislop Anti-Slop Check"
author: "dislop-ai"
description: "Zero-dependency anti-slop linter for AI-written Markdown, Word (.docx), PowerPoint (.pptx), and HTML/CSS/JSX."
branding:
  icon: "edit-3"
  color: "red"

inputs:
  paths:
    description: "Newline- or whitespace-separated file or directory paths to inspect (ignored when `changed` is set)."
    required: false
    default: "."
  pack:
    description: "Optional pack override (`auto`, `business-brief`, `engineering-spec`, `regulated-comms`, `literary-essay`, `deck-and-ui`, `executive-deck`)."
    required: false
    default: ""
  fail-on:
    description: "Minimum severity that exits non-zero (`error`, `warning`, `info`, `never`)."
    required: false
    default: "error"
  changed:
    description: "Git base ref for incremental line-level checking (for example `origin/main`)."
    required: false
    default: ""
  format:
    description: "Output format (`github`, `text`, `json`, `sarif`, `md`)."
    required: false
    default: "github"
  lang:
    description: "Message language (`en` or `zh`)."
    required: false
    default: "en"
  sarif-file:
    description: "Optional file path to write SARIF 2.1.0 output when `format: sarif` is selected."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: "22"

    - name: Run dislop deterministic check
      shell: bash
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_PACK: ${{ inputs.pack }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_CHANGED: ${{ inputs.changed }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_LANG: ${{ inputs.lang }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
        ACTION_DIR: ${{ github.action_path }}
      run: |
        set -euo pipefail
        ARGS=("check" "--fail-on" "${INPUT_FAIL_ON}" "--format" "${INPUT_FORMAT}" "--lang" "${INPUT_LANG}")
        if [ -n "${INPUT_PACK}" ]; then
          ARGS+=("--pack" "${INPUT_PACK}")
        fi
        if [ -n "${INPUT_CHANGED}" ]; then
          ARGS+=("--changed" "${INPUT_CHANGED}")
        else
          NONEMPTY_LINES=()
          while IFS= read -r line; do
            trimmed="${line#"${line%%[![:space:]]*}"}"
            trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
            [ -n "${trimmed}" ] && NONEMPTY_LINES+=("${trimmed}")
          done <<< "${INPUT_PATHS}"
          if [ "${#NONEMPTY_LINES[@]}" -gt 1 ]; then
            for item in "${NONEMPTY_LINES[@]}"; do
              ARGS+=("${item}")
            done
          elif [ "${#NONEMPTY_LINES[@]}" -eq 1 ]; then
            only="${NONEMPTY_LINES[0]}"
            if [ -e "${only}" ]; then
              ARGS+=("${only}")
            else
              read -r -a words <<< "${only}"
              ARGS+=("${words[@]}")
            fi
          fi
        fi
        if [ "${INPUT_FORMAT}" = "sarif" ] && [ -n "${INPUT_SARIF_FILE}" ]; then
          node "${ACTION_DIR}/bin/dislop.mjs" "${ARGS[@]}" > "${INPUT_SARIF_FILE}"
        else
          node "${ACTION_DIR}/bin/dislop.mjs" "${ARGS[@]}"
        fi
