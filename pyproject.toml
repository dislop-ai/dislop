[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dislop"
version = "0.9.0"
description = "Cutting AI slop is real productivity. Linter for AI Slop in docs, web UI, Word, and PowerPoint — zero-dependency CLI and MCP."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
  { name = "dislop contributors" }
]
keywords = ["anti-slop", "de-slop", "deslop", "ai-slop", "ai-writing", "humanizer", "linter", "proofreading", "agent-skill", "claude", "claude-code", "cline", "codex", "cursor", "windsurf", "llms-txt", "mcp", "mcp-server", "markdown", "docx", "pptx", "slides", "web-ui", "editorial", "quality-gate"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://dislop.com"
Repository = "https://github.com/dislop-ai/dislop"
Issues = "https://github.com/dislop-ai/dislop/issues"

[project.optional-dependencies]
onnx = ["onnxruntime>=1.18.0"]

[project.scripts]
dislop = "dislop.cli:main"
dislop-mcp = "dislop.mcp_server:main"

[tool.hatch.build.targets.sdist]
include = [
  "pyproject.toml",
  "README.md",
  "README.zh-CN.md",
  "PRODUCT.md",
  "LICENSE",
  "src/dislop/**",
  "models/**",
  "packs/**",
  "patterns/taxonomy.json",
  "patterns/ai-tic-rubric.json",
  "patterns/dimensions/**",
  "patterns/banks/**",
  "skills/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dislop"]

[tool.hatch.build.targets.wheel.force-include]
"models" = "dislop/models"
"packs" = "dislop/packs"
"patterns" = "dislop/patterns"
