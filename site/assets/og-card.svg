<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="dislop — Cutting AI slop is real productivity.">
  <title>dislop — Cutting AI slop is real productivity.</title>
  <!-- Charcoal Ink Stage (#14171A) framing a crisp 0px White Galley Slip -->
  <rect width="1200" height="630" fill="#14171A"/>
  <line x1="56" y1="0" x2="56" y2="630" stroke="#2D333B" stroke-width="1"/>
  <line x1="1144" y1="0" x2="1144" y2="630" stroke="#2D333B" stroke-width="1"/>
  <line x1="0" y1="48" x2="1200" y2="48" stroke="#2D333B" stroke-width="1"/>
  <line x1="0" y1="582" x2="1200" y2="582" stroke="#2D333B" stroke-width="1"/>

  <!-- Central clean galley slip -->
  <rect x="57" y="49" width="1086" height="532" rx="0" fill="#FFFFFF"/>

  <!-- Brand header using canonical logo.svg geometry -->
  <g transform="translate(112, 96)">
    <g transform="scale(0.90625)">
      <rect width="64" height="64" rx="12" fill="#14171A"/>
      <line x1="10" y1="38" x2="54" y2="38" stroke="#F4F5F3" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.26"/>
      <path d="M10 38H34C44.5 38 52 30.8 52 21.5C52 14.5 47.2 10 41.2 10C34.8 10 30.5 15 30.5 22.2C30.5 33.8 39.5 45.5 53 51" stroke="#F04438" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="78" y="45" fill="#14171A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2">dislop</text>
    <text x="234" y="42" fill="#474C55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">dislop.com</text>
  </g>

  <!-- Struck complete AI opener with authentic dele loop -->
  <rect x="110" y="206" width="520" height="48" rx="0" fill="#FEF3F2"/>
  <text id="og-en-opener" x="116" y="242" fill="#5E646E" font-family="Georgia, 'Times New Roman', serif" font-size="40">Certainly! Here is your draft.</text>
  <path data-dele="true" d="M112 229H622C638 229 650 218 650 205C650 195 643 189 634 189C624 189 618 196 618 206C618 222 632 239 652 246" stroke="#F04438" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="112" y="326" fill="#14171A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-1.1">Cutting AI slop is real productivity.</text>

  <!-- Proof strip showing wash + blue dashed warnings -->
  <rect x="112" y="374" width="976" height="114" rx="0" fill="#F6F7F5" stroke="#D5D7D2" stroke-width="1"/>
  <rect x="142" y="399" width="268" height="36" rx="0" fill="#EFF4FF"/>
  <rect x="598" y="399" width="202" height="36" rx="0" fill="#EFF4FF"/>
  <text x="146" y="427" fill="#14171A" font-family="Georgia, 'Times New Roman', serif" font-size="28"><tspan>It's worth noting that</tspan><tspan> this upgrade is </tspan><tspan>a game-changer</tspan><tspan>.</tspan></text>
  <line x1="146" y1="437" x2="408" y2="437" stroke="#1B52B0" stroke-width="2.4" stroke-dasharray="6 4"/>
  <line x1="601" y1="437" x2="798" y2="437" stroke="#1B52B0" stroke-width="2.4" stroke-dasharray="6 4"/>
  <text x="146" y="468" fill="#1B52B0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600">1 hard bug  ·  2 warnings  ·  docs, web pages, and slides</text>

  <!-- Clean footer strip -->
  <text x="112" y="542" fill="#474C55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="500">Linter for AI Slop — catch and fix AI slop locally before sending.</text>
